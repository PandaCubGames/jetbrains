name: Sync upstream Dracula

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'dracula/jetbrains'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out the fork's default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Test merge helper
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/dracula/jetbrains.git
          git fetch --no-tags upstream master
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge upstream and preserve custom colors
        id: merge
        run: python3 .github/scripts/sync_upstream.py upstream/master
      - name: Check whether this commit needs a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-$(git rev-parse HEAD)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v5
        if: steps.release.outputs.needed == 'true'
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
        if: steps.release.outputs.needed == 'true'
      # GITHUB_TOKEN pushes do not trigger push workflows. Validate and release
      # here, before and after the push respectively.
      - name: Build and verify merged plugin
        if: steps.release.outputs.needed == 'true'
        run: bash ./gradlew --no-daemon buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.needed == 'true'
        with:
          name: synced-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Update default branch
        if: steps.merge.outputs.changed == 'true'
        run: git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
      - name: Release the verified build
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          commit=$(git rev-parse HEAD)
          tag="build-${commit}"
          gh release create "$tag" build/distributions/*.zip --target "$commit" \
            --title "Dracula fork — $tag" --generate-notes
