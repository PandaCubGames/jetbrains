name: Build and release plugin

on:
  push:
    branches: [master, main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read plugin version
        id: version
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties | tr -d '[:space:]')
          if [[ -z "$version" ]]; then echo 'pluginVersion missing from gradle.properties' >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      # v5 retains the MIT-licensed caching implementation.
      - name: Free disk space for IntelliJ distributions
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: gradle/actions/setup-gradle@v5
      - name: Test upstream merge helper
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Build and verify plugin
        run: bash ./gradlew --no-daemon buildPlugin test verifyPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-artifact
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    # A pluginVersion bump merged into the default branch publishes v<pluginVersion>
    # automatically; pushing a v* tag still works, and manual runs make a build snapshot.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Release the exact ZIP that passed verification; do not rebuild it.
      - uses: actions/download-artifact@v8
        with:
          name: plugin-artifact
          path: dist
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$REF_NAME"
          elif [[ "$EVENT" == push ]]; then
            tag="v${VERSION}"
          else
            tag="build-${COMMIT}"
          fi
          # Version releases drive the README badge; build snapshots must never become "latest".
          latest=--latest
          if [[ "$tag" == build-* ]]; then latest=--latest=false; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" dist/*.zip --target "$COMMIT" "$latest" \
              --title "pandracula — $tag" --generate-notes
          fi
