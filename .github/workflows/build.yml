name: Build plugin

# CI only. Releases and Marketplace publishing come from the sync workflow,
# so each version is published exactly once.
on:
  push:
    branches: [master, main, 'release/**', 'claude/**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the build number counts commits
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Free disk space for IntelliJ distributions
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /
      # v5 retains the MIT-licensed caching implementation.
      - uses: gradle/actions/setup-gradle@v5
      - name: Test upstream merge helper
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check fork customizations
        run: python3 .github/scripts/sync_upstream.py --check
      - name: Build and verify plugin
        run: |
          version=$(python3 .github/scripts/sync_upstream.py --version)
          bash ./gradlew --no-daemon buildPlugin verifyPlugin -PpluginVersion="$version"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-artifact
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30
