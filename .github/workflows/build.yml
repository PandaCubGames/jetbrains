name: Build and release plugin

on:
  push:
    branches: [master, main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      # v5 retains the MIT-licensed caching implementation.
      - uses: gradle/actions/setup-gradle@v5
      - name: Test upstream merge helper
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Build and verify plugin
        run: bash ./gradlew --no-daemon buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-artifact
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Release the exact ZIP that passed verification; do not rebuild it.
      - uses: actions/download-artifact@v8
        with:
          name: plugin-artifact
          path: dist
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="build-${COMMIT}"
          if [[ "$REF" == refs/tags/v* ]]; then tag="$REF_NAME"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" dist/*.zip --target "$COMMIT" \
              --title "Dracula fork — $tag" --generate-notes
          fi
